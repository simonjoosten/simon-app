<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>simon-app</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:2rem auto;padding:0 1rem;color:#222}
  input,button{font:inherit;padding:.5rem .7rem;border:1px solid #bbb;border-radius:6px}
  button{cursor:pointer;background:#f3f3f3} .row{display:flex;gap:.5rem;margin:.5rem 0}
  .row input{flex:1} li{display:flex;gap:.5rem;align-items:center;padding:.3rem 0}
  li.done span{text-decoration:line-through;color:#888} small{color:#888} .err{color:#c00}
  .box{border:1px solid #ddd;border-radius:8px;padding:1rem;margin:1rem 0}
</style>
</head>
<body>
<h1>simon-app</h1>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const api = async (url, method = 'GET', data) => {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Er ging iets mis');
  return j;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function start() {
  try { render(await api('/api/me')); } catch { loginView(); }
}

function loginView() {
  $('#app').innerHTML = `
    <div class="box"><h3>Inloggen</h3>
      <div class="row"><input id="code" placeholder="Inlogcode (XXXXX-XXXXX)"><button id="go">Inloggen</button></div>
      <div id="e1" class="err"></div></div>
    <div class="box"><h3>Nog geen code?</h3>
      <div class="row"><input id="name" placeholder="Je naam"><button id="ask">Code aanvragen</button></div>
      <div id="e2"></div></div>`;
  $('#go').onclick = async () => { try { await api('/api/login', 'POST', { code: $('#code').value }); start(); } catch (e) { $('#e1').textContent = e.message; } };
  $('#ask').onclick = async () => {
    try { await api('/api/request', 'POST', { name: $('#name').value }); $('#e2').textContent = 'Aanvraag verstuurd! Simon moet hem eerst goedkeuren.'; }
    catch (e) { $('#e2').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
}

async function render(me) {
  const items = await api('/api/items');
  $('#app').innerHTML = `
    <p>Hoi ${esc(me.name)} <button id="out">Uitloggen</button></p>
    <div id="admin"></div>
    <div class="box"><h3>Gedeelde lijst</h3>
      <div class="row"><input id="txt" placeholder="Nieuw item"><button id="add">Toevoegen</button></div>
      <ul style="list-style:none;padding:0">${items.map((i) => `
        <li class="${i.done ? 'done' : ''}"><input type="checkbox" ${i.done ? 'checked' : ''} data-t="${i.id}">
        <span style="flex:1">${esc(i.text)} <small>${esc(i.by)}</small></span><button data-d="${i.id}">✕</button></li>`).join('')}</ul></div>`;
  $('#out').onclick = async () => { await api('/api/logout', 'POST'); loginView(); };
  $('#add').onclick = async () => { if ($('#txt').value.trim()) { await api('/api/items', 'POST', { text: $('#txt').value }); render(me); } };
  document.querySelectorAll('[data-t]').forEach((e) => e.onchange = async () => { await api('/api/items/' + e.dataset.t, 'PATCH'); render(me); });
  document.querySelectorAll('[data-d]').forEach((e) => e.onclick = async () => { await api('/api/items/' + e.dataset.d, 'DELETE'); render(me); });
  if (me.role === 'admin') adminView();
}

async function adminView() {
  const reqs = await api('/api/requests');
  if (!reqs.length) return;
  $('#admin').innerHTML = `<div class="box"><h3>Aanvragen voor toegang</h3>${reqs.map((r) => `
    <div class="row"><span style="flex:1">${esc(r.name)}</span>
    <button data-a="${r.id}">Goedkeuren</button><button data-n="${r.id}">Weigeren</button></div>`).join('')}<div id="newcode"></div></div>`;
  document.querySelectorAll('[data-a]').forEach((e) => e.onclick = async () => {
    const r = await api(`/api/requests/${e.dataset.a}/approve`, 'POST');
    await adminView();
    $('#admin').insertAdjacentHTML('afterbegin', `<div class="box">Code voor <b>${esc(r.name)}</b>: <b>${esc(r.code)}</b><br><small>Geef deze door; hij wordt maar één keer getoond.</small></div>`);
  });
  document.querySelectorAll('[data-n]').forEach((e) => e.onclick = async () => { await api(`/api/requests/${e.dataset.n}/deny`, 'POST'); adminView(); });
}
start();
</script>
</body>
</html>
