<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klusjes-test</title>
<script type="importmap">{"imports":{"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js":"./games/fake-firestore.js"}}</script>
<style>:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2330;--line:#e4e6ee;--accent:#6366f1}body{font-family:system-ui;background:var(--bg);color:var(--ink);margin:0;display:flex;gap:.5rem}
.col{width:400px;padding:.5rem}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin:.6rem 0}.row{display:flex;gap:.5rem;margin:.4rem 0;align-items:center}.row.wrap{flex-wrap:wrap}.row input{flex:1;min-width:0}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.4rem .7rem}button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.err{color:#ef4444}.center{text-align:center}small{color:#8a90a2}.chip{background:var(--line);border-radius:99px;padding:.1rem .5rem;font-size:.8rem}.code{font:700 1.4rem monospace}</style>
<div class="col"><b>ADMIN</b><div id="a"></div></div><div class="col"><b>LID (Broer)</b><div id="m"></div></div>
<script type="module">
import { klusjesView, klusjesAdminView } from './klusjes.js';
import { setDoc, doc } from './games/fake-firestore.js';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
window.__errs = []; window.addEventListener('error', (e) => window.__errs.push(e.message)); window.addEventListener('unhandledrejection', (e) => window.__errs.push(String(e.reason && e.reason.message || e.reason)));
await setDoc(doc({}, 'users', 'adm'), { name: 'Simon', status: 'approved' });
await setDoc(doc({}, 'users', 'bro'), { name: 'Broer', status: 'approved' });
const admin = { uid: 'adm', name: 'Simon', admin: true, apps: ['klusjesadmin'] }, bro = { uid: 'bro', name: 'Broer', admin: false, apps: ['klusjes'] };
const nice = (e) => e.message;
window.openA = () => klusjesAdminView({ db: {}, me: admin, esc, nice, view: document.getElementById('a') });
window.openM = () => klusjesView({ db: {}, me: bro, esc, nice, view: document.getElementById('m') });
await openA(); await openM(); window.__ready = true;
</script>
