<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>simon-app</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
  :root{--bg:#f6f7fb;--card:#fff;--ink:#1f2330;--mute:#8a90a2;--line:#e4e6ee;--accent:#6366f1}
  @media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e29;--ink:#eceef5;--mute:#8a90a2;--line:#2a2e3d}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  input,button{font:inherit;color:inherit} input:not([type=checkbox]){padding:.6rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.55rem .9rem}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{display:flex;gap:.5rem;margin:.5rem 0;align-items:center} .row input:not([type=checkbox]){flex:1;min-width:0}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin:.8rem 0}
  ul{list-style:none;padding:0;margin:0} li{display:flex;gap:.5rem;align-items:center;padding:.45rem 0}
  li.done span{text-decoration:line-through;color:var(--mute)} small{color:var(--mute)} .err{color:#ef4444}
  .code{font:700 1.4rem ui-monospace,monospace;letter-spacing:.06em;color:var(--accent);margin:.3rem 0}

  /* Inlogscherm */
  .login{max-width:420px;margin:0 auto;padding:2rem 1rem} .login .logo{text-align:center} .login .logo img{width:84px}
  .tabs{display:flex;gap:.4rem;margin:1rem 0 0} .tabs button{flex:1} .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* Telefoon-homescherm */
  .phone{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(160deg,#4f46e5 0%,#7c3aed 45%,#06b6d4 100%);color:#fff}
  .status{display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.4rem .2rem;font-weight:600;font-size:.95rem}
  .status button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:99px;padding:.3rem .8rem;font-size:.8rem}
  .hello{padding:.4rem 1.4rem 0;opacity:.85;font-size:.9rem}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4rem .4rem;padding:1.5rem 1rem;flex:1;align-content:start}
  .app{display:flex;flex-direction:column;align-items:center;gap:.35rem;background:none;border:0;color:#fff;padding:0;font-size:.72rem;position:relative}
  .ico{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .ico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .badge{position:absolute;top:-6px;right:4px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;border-radius:99px;min-width:20px;padding:0 .35rem;line-height:20px;text-align:center}
  .dock{display:flex;justify-content:center;gap:1.6rem;margin:0 1rem 1rem;padding:.9rem;border-radius:26px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px)}

  /* Geopende app */
  .appview{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .appbar{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}
  .appbar .ico{width:32px;height:32px;border-radius:9px;box-shadow:none} .appbar .ico svg{width:18px;height:18px}
  .appbar b{flex:1} .appview main{padding:0 1rem 2rem}
  .home{display:block;margin:0 auto 1rem;width:130px;height:5px;border-radius:9px;background:var(--mute);opacity:.5;border:0;padding:0}
  .center{text-align:center;padding:3rem 1rem}
  .row input[type=radio]{flex:none;width:auto}
  .chip{display:inline-block;padding:.1rem .5rem;border-radius:99px;background:var(--line);font-size:.8rem}
  .row.wrap{flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, getDocs, query, where, orderBy, onSnapshot, writeBatch }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { firebaseConfig, ADMIN_UID } from './firebase-config.js';

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
const META = {
  installer: { n: 'App Installer', core: true, c: 'linear-gradient(135deg,#3b82f6,#1d4ed8)', i: svg('<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>') },
  notifications: { n: 'Notificaties', core: true, c: 'linear-gradient(135deg,#f97316,#ef4444)', i: svg('<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 004 0"/>') },
  lijst: { n: 'Lijst', c: 'linear-gradient(135deg,#22c55e,#15803d)', i: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>') },
  join: { n: 'Join requests', admin: true, c: 'linear-gradient(135deg,#a855f7,#6d28d9)', i: svg('<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M19 8v6M16 11h6"/>') },
  klusjes: { n: 'Klusjes', c: 'linear-gradient(135deg,#f59e0b,#ea580c)', i: svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 13l2 2 4-4"/>') },
  klusjesadmin: { n: 'Klusjes Admin', admin: true, c: 'linear-gradient(135deg,#7c2d12,#431407)', i: svg('<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM12 11l1 2 2 .3-1.5 1.4.4 2.1-1.9-1-1.9 1 .4-2.1L9 13.3l2-.3z"/>') },
  dobbel: { n: 'Dobbel & kies', c: 'linear-gradient(135deg,#f43f5e,#be123c)', i: svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 8.5h.01M15.5 8.5h.01M12 12h.01M8.5 15.5h.01M15.5 15.5h.01"/>') },
  pixel: { n: 'Pixel-art', c: 'linear-gradient(135deg,#10b981,#0369a1)', i: svg('<path d="M4 4h4v4H4zM12 4h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM8 16h4v4H8z"/>') },
  piano: { n: 'Piano', c: 'linear-gradient(135deg,#334155,#0f172a)', i: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M12 5v14M16 5v14M7 5v8h2V5M11 5v8h2V5M15 5v8h2V5"/>') },
  emojimix: { n: 'Emoji-mixer', c: 'linear-gradient(135deg,#fbbf24,#ec4899)', i: svg('<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/><path d="M7.5 11h.01M10.5 11h.01M13.5 11h.01M16.5 11h.01"/>') },
  weer: { n: 'Weer', c: 'linear-gradient(135deg,#38bdf8,#2563eb)', i: svg('<path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.5 1.5A3.5 3.5 0 0117 18z"/><path d="M8 21l1-2M12 21l1-2M16 21l1-2"/>') },
  gamescroller: { n: 'Gamescroller', c: 'linear-gradient(135deg,#8b5cf6,#ec4899)', i: svg('<rect x="3" y="8" width="18" height="10" rx="4"/><path d="M8 11v4M6 13h4"/><circle cx="15.5" cy="12" r="1"/><circle cx="18" cy="14" r="1"/>') },
  chat: { n: 'Chat', c: 'linear-gradient(135deg,#06b6d4,#0e7490)', i: svg('<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M8.5 11h7M8.5 14h4"/>') },
  limo: { n: 'Limo', c: 'linear-gradient(135deg,#f59e0b,#b45309)', i: svg('<path d="M3 13l2-5a2 2 0 012-1h10a2 2 0 012 1l2 5v4a1 1 0 01-1 1h-1a2 2 0 01-4 0H9a2 2 0 01-4 0H4a1 1 0 01-1-1z"/><path d="M3 13h18"/>') },
  limoadmin: { n: 'Limo Admin', admin: true, c: 'linear-gradient(135deg,#475569,#0f172a)', i: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 9.5V3M9.9 13.2L4 16M14.1 13.2L20 16"/>') },
  notify: { n: 'Notificatie-maker', admin: true, c: 'linear-gradient(135deg,#ec4899,#be123c)', i: svg('<path d="M3 11l18-7-7 18-3-8-8-3z"/>') },
};
const ico = (id) => `<span class="ico" style="background:${META[id].c}">${META[id].i}</span>`;

const norm = (c) => String(c || '').trim().toUpperCase();
const sha = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map((b) => b.toString(16).padStart(2, '0')).join('');
// Een inlogcode wordt het wachtwoord; het e-mailadres wordt van de code afgeleid.
const emailFor = async (code) => `u${(await sha('simon-app:' + norm(code))).slice(0, 24)}@simon-app.invalid`;
const newCode = () => { const h = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase(); return `${h.slice(0, 5)}-${h.slice(5, 10)}-${h.slice(10, 16)}`; };
const nice = (e) => ({ 'auth/invalid-credential': 'Ongeldige code', 'auth/too-many-requests': 'Te veel pogingen, probeer later opnieuw', 'auth/network-request-failed': 'Geen verbinding', 'permission-denied': 'Geen toegang (de regels in Firebase staan dit niet toe)' }[e.code] || (e.code ? `${e.message || 'Fout'} (${e.code})` : e.message) || 'Er ging iets mis');

let me = null;      // { uid, name, admin, status, apps, lastRead }

const logout = async () => { await signOut(auth); location.reload(); };

onAuthStateChanged(auth, async (u) => {
  if (signupInFlight) return;
  if (!u) { me = null; return loginView(); }
  try { await boot(u); } catch (e) { $('#app').innerHTML = `<div class="login"><div class="box center"><h3>Er ging iets mis</h3><p class="err">${esc(nice(e))}</p><button id="out">Uitloggen</button></div></div>`; $('#out').onclick = logout; }
});

async function boot(u) {
  const admin = u.uid === ADMIN_UID && u.providerData.some((p) => p.providerId === 'google.com');
  const ref = doc(db, 'users', u.uid);
  let snap = await getDoc(ref);
  if (admin && !snap.exists()) { await setDoc(ref, { name: 'Simon', status: 'approved', created: Date.now(), apps: ['lijst', 'join', 'notify'], lastRead: 0 }); snap = await getDoc(ref); }
  if (!snap.exists()) { me = { uid: u.uid, name: '', status: u.providerData.some((p) => p.providerId === 'google.com') ? 'noaccount' : 'denied' }; return waitView(); }
  const d = snap.data();
  me = { uid: u.uid, name: d.name, admin, status: d.status, apps: d.apps || [], lastRead: d.lastRead || 0, points: d.points || 0 };
  if (admin) { const need = ['limoadmin', 'klusjesadmin'].filter((a) => !me.apps.includes(a)); if (need.length) { me.apps = [...me.apps, ...need]; await updateDoc(ref, { apps: me.apps }); } }
  if (me.status !== 'approved') return waitView();
  // Profiel (naam) voor de chat, zodat anderen je kunnen vinden
  try { const p = await getDoc(doc(db, 'profiles', u.uid)); if (!p.exists() || p.data().name !== me.name) await setDoc(doc(db, 'profiles', u.uid), { name: me.name }); } catch (e) { console.error(e); }
  await homeView();
}

/* ---------- Inloggen / account aanmaken ---------- */
function loginView(mode = 'login') {
  $('#app').innerHTML = `<div class="login">
    <div class="logo"><img src="logo.svg" alt=""><h1>simon-app</h1></div>
    <div class="tabs"><button data-m="login" class="${mode === 'login' ? 'on' : ''}">Inloggen</button><button data-m="signup" class="${mode === 'signup' ? 'on' : ''}">Account aanmaken</button></div>
    <div class="box">${mode === 'login' ? `
      <form id="f" autocomplete="on" method="get" action="./">
        <input type="text" autocomplete="username" value="simon-app" tabindex="-1" aria-hidden="true" style="position:absolute;opacity:0;height:0;width:0;border:0;padding:0">
        <div class="row"><input id="code" type="password" autocomplete="current-password" placeholder="Inlogcode"><button class="pri" id="go" type="submit">Inloggen</button></div>
      </form>
      <div id="e" class="err"></div>
      <p style="text-align:center;margin:.8rem 0 0"><small><a href="#" id="g">Admin? Inloggen met Google</a></small></p>` : `
      <p>Maak een account aan. Je krijgt een eigen inlogcode en Simon moet je daarna goedkeuren voordat je erin kan.</p>
      <div class="row"><input id="name" placeholder="Je naam"><button class="pri" id="go">Aanmaken</button></div>
      <div id="e" class="err"></div>`}</div></div>`;
  document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => loginView(b.dataset.m));
  const go = async () => {
    $('#e').textContent = '';
    try {
      if (mode === 'login') await signInWithEmailAndPassword(auth, await emailFor($('#code').value), norm($('#code').value));
      else await signup($('#name').value);
    } catch (e) { $('#e').textContent = nice(e); }
  };
  if (mode === 'login') $('#f').onsubmit = async (e) => {
    if (nativeSubmit) return; // echte verzending: dan biedt Safari aan om de code te bewaren
    e.preventDefault();
    $('#e').textContent = '';
    signupInFlight = true;
    try {
      await signInWithEmailAndPassword(auth, await emailFor($('#code').value), norm($('#code').value));
      nativeSubmit = true;
      const f = $('#f'); (f.requestSubmit || f.submit).call(f);
    } catch (err) { signupInFlight = false; $('#e').textContent = nice(err); }
  };
  else { $('#go').onclick = go; $('#name').onkeydown = (e) => { if (e.key === 'Enter') go(); }; }
  if ($('#g')) $('#g').onclick = async (e) => { e.preventDefault(); try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (err) { $('#e').textContent = nice(err); } };
}

async function signup(name) {
  name = String(name || '').trim().slice(0, 60);
  if (!name) throw new Error('Naam is verplicht');
  const code = newCode();
  signupInFlight = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, await emailFor(code), norm(code));
    await setDoc(doc(db, 'users', cred.user.uid), { name, status: 'pending', created: Date.now(), apps: [], lastRead: 0 });
  } finally { signupInFlight = false; }
  codeView(name, code);
}
let signupInFlight = false;
let nativeSubmit = false;

function codeView(name, code) {
  $('#app').innerHTML = `<div class="login"><div class="logo"><img src="logo.svg" alt=""></div>
    <div class="box"><h3>Account aangemaakt, ${esc(name)}!</h3>
      <p>Dit is jouw inlogcode:</p><div class="code">${esc(code)}</div>
      <p><b>Bewaar hem goed</b>, hij wordt maar één keer getoond. Je verzoek staat nu bij Simon.</p>
      <button class="pri" id="ok">Ik heb hem bewaard</button></div></div>`;
  $('#ok').onclick = () => location.reload();
}

function waitView() {
  const noAccount = me.status === 'noaccount';
  const denied = me.status === 'denied' || me.status === 'removed';
  const title = noAccount ? 'Nog geen toegang' : denied ? 'Geen toegang' : 'Wachten op goedkeuring';
  const text = noAccount ? 'Je bent ingelogd, maar dit account is nog niet ingesteld als admin of lid. Ben jij Simon? Stuur dan dit ID naar Claude:'
    : denied ? 'Simon heeft je verzoek niet goedgekeurd.' : `Hoi ${esc(me.name)}, Simon moet je join request nog goedkeuren.`;
  $('#app').innerHTML = `<div class="login"><div class="logo"><img src="logo.svg" alt=""></div>
    <div class="box center"><h3>${title}</h3><p>${text}</p>
    ${noAccount ? `<div class="code" style="font-size:.9rem;word-break:break-all;user-select:all">${esc(me.uid)}</div>` : ''}
    <div class="row" style="justify-content:center">${(denied || noAccount) ? '' : '<button id="re">Opnieuw checken</button>'}<button id="out">Uitloggen</button></div></div></div>`;
  $('#out').onclick = logout;
  if ($('#re')) $('#re').onclick = () => boot(auth.currentUser);
}

/* ---------- Notificaties ophalen ---------- */
async function myNotifications() {
  const col = collection(db, 'notifications');
  const snaps = await Promise.all([getDocs(query(col, where('to', '==', 'all'))), getDocs(query(col, where('to', '==', me.uid)))]);
  const seen = new Map();
  snaps.forEach((s) => s.forEach((d) => seen.set(d.id, { id: d.id, ...d.data() })));
  return [...seen.values()].sort((a, b) => b.created - a.created).slice(0, 100);
}

/* ---------- Live luisteraars ---------- */
let unsubs = [];
const stop = () => { unsubs.forEach((u) => u()); unsubs = []; };
const live = (q, cb, onErr) => unsubs.push(onSnapshot(q, cb, (e) => { console.error(e); if (onErr) onErr(e); }));
function setBadge(id, n) {
  const b = document.querySelector(`[data-app="${id}"]`); if (!b) return;
  let el = b.querySelector('.badge');
  if (!n) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('span'); el.className = 'badge'; b.appendChild(el); }
  el.textContent = n;
}

/* ---------- Homescherm ---------- */
async function homeView() {
  stop();
  const ids = Object.keys(META).filter((id) => !META[id].admin || me.admin);
  const installed = (id) => META[id].core || me.apps.includes(id);
  const [notes, pend] = await Promise.all([
    myNotifications().catch(() => []),
    me.admin ? getDocs(query(collection(db, 'users'), where('status', '==', 'pending'))).then((s) => s.size).catch(() => 0) : 0,
  ]);
  const unread = notes.filter((n) => n.created > me.lastRead).length;
  const badge = { notifications: unread, join: pend };
  const tile = (id) => `<button class="app" data-app="${id}">${ico(id)}${badge[id] ? `<span class="badge">${badge[id]}</span>` : ''}${esc(META[id].n)}</button>`;
  const mine = ids.filter(installed);
  const time = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  $('#app').innerHTML = `<div class="phone">
    <div class="status"><span>${time}</span><button id="out">Uitloggen</button></div>
    <div class="hello">Hoi ${esc(me.name)} 👋</div>
    <div class="grid">${mine.filter((i) => !META[i].core).map(tile).join('') || '<small style="grid-column:1/-1;text-align:center">Geen apps. Open de App Installer.</small>'}</div>
    <div class="dock">${mine.filter((i) => META[i].core).map(tile).join('')}</div></div>`;
  $('#out').onclick = logout;
  document.querySelectorAll('[data-app]').forEach((b) => b.onclick = () => openApp(b.dataset.app));
  const col = collection(db, 'limoRequests');
  if (me.admin && me.apps.includes('limoadmin')) live(query(col, where('status', '==', 'pending')), (sn) => setBadge('limoadmin', sn.size));
  if (me.apps.includes('klusjes') || (me.admin && me.apps.includes('klusjesadmin'))) import('./klusjes.js').then((m) => m.watchKlusjesBadge({ db, me, live }, setBadge)).catch(() => {});
  if (me.apps.includes('chat')) import('./chat.js').then((m) => m.watchChatBadge({ db, me, live }, setBadge)).catch(() => {});
  if (me.apps.includes('limo')) live(query(col, where('uid', '==', me.uid)), (sn) => setBadge('limo', sn.docs.filter((d) => { const r = d.data(); return !r.dismissed && ['payment_requested', 'accepted', 'declined'].includes(r.status); }).length));
}

async function openApp(id) {
  stop();
  $('#app').innerHTML = `<div class="appview"><div class="appbar">${ico(id)}<b>${esc(META[id].n)}</b><button id="close">Sluiten</button></div><main id="view"></main>
    <div style="flex:1"></div><button class="home" id="home" aria-label="Home"></button></div>`;
  $('#close').onclick = homeView; $('#home').onclick = homeView;
  try { await ({ installer: installerView, notifications: notificationsView, lijst: lijstView, join: joinView, notify: notifyView, limo: limoView, limoadmin: limoAdminView, chat: chatApp, gamescroller: gameApp, weer: weerApp, klusjes: klusjesApp, klusjesadmin: klusjesAdminApp, emojimix: emojiApp, dobbel: dobbelApp, pixel: pixelApp, piano: pianoApp })[id](); }
  catch (e) { $('#view').innerHTML = `<div class="box err">${esc(nice(e))}</div>`; }
}

/* ---------- App Installer ---------- */
async function installerView() {
  const list = Object.keys(META).filter((id) => !META[id].core && (!META[id].admin || me.admin));
  $('#view').innerHTML = `<div class="box"><h3>Beschikbare apps</h3><ul>${list.map((id) => { const on = me.apps.includes(id); return `
    <li>${ico(id)}<span style="flex:1;margin-left:.4rem">${esc(META[id].n)}</span>
    <button class="${on ? '' : 'pri'}" data-i="${id}">${on ? 'Verwijderen' : 'Installeren'}</button></li>`; }).join('')}</ul>
    <small>App Installer en Notificaties zitten er altijd bij.</small></div>`;
  document.querySelectorAll('[data-i]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.i;
    me.apps = me.apps.includes(id) ? me.apps.filter((x) => x !== id) : [...me.apps, id];
    await updateDoc(doc(db, 'users', me.uid), { apps: me.apps });
    installerView();
  });

/* ---------- Join requests (admin) ---------- */
async function joinView() {
  const snap = await getDocs(collection(db, 'users'));
  const users = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((u) => u.id !== me.uid);
  const pending = users.filter((u) => u.status === 'pending').sort((a, b) => a.created - b.created);
  const members = users.filter((u) => u.status === 'approved');
  const set = async (id, status, welcome) => {
    await updateDoc(doc(db, 'users', id), { status });
    if (welcome) await addDoc(collection(db, 'notifications'), { to: id, toName: users.find((u) => u.id === id)?.name, text: 'Welkom! Je join request is goedgekeurd.', created: Date.now() });
    joinView();
  };
  $('#view').innerHTML = `<div class="box"><h3>Join requests</h3>
    ${pending.length ? pending.map((u) => `<div class="row"><span style="flex:1">${esc(u.name)}<br><small>${new Date(u.created).toLocaleString('nl-NL')}</small></span>
      <button class="pri" data-a="${u.id}">Goedkeuren</button><button data-n="${u.id}">Weigeren</button></div>`).join('') : '<small>Geen openstaande verzoeken.</small>'}</div>
    <div class="box"><h3>Leden</h3>${members.length ? members.map((u) => `<div class="row"><span style="flex:1">${esc(u.name)}</span><button data-r="${u.id}">Verwijderen</button></div>`).join('') : '<small>Nog geen leden.</small>'}</div>`;
  document.querySelectorAll('[data-a]').forEach((e) => e.onclick = () => set(e.dataset.a, 'approved', true));
  document.querySelectorAll('[data-n]').forEach((e) => e.onclick = () => set(e.dataset.n, 'denied'));
  document.querySelectorAll('[data-r]').forEach((e) => e.onclick = () => confirm('Dit lid verwijderen?') && set(e.dataset.r, 'removed'));
}

/* ---------- Limo (leden) ---------- */
async function pushNtfy(text) {
  try {
    const t = (await getDoc(doc(db, 'config', 'push'))).data()?.topic;
    if (!t) return 'Geen onderwerp ingesteld';
    const r = await fetch('https://ntfy.sh/', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: t, title: 'Limo', message: text, click: location.href.split('?')[0].split('#')[0], tags: ['car'] }) });
    return r.ok ? 'ok' : `ntfy gaf fout ${r.status}`;
  } catch (e) { return 'Geen verbinding met ntfy'; }
}
const when = (t) => new Date(t).toLocaleString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const kind = (t) => (t === 'taxi' ? '🚕 Taxi' : '🛠 Service');

async function limoView() {
  let points = me.points || 0, reqs = [];
  $('#view').innerHTML = `
    <div class="box center" style="padding:1.2rem"><small>Jouw Limo-punten</small><div class="code" id="pts" style="font-size:2.4rem">${points}</div></div>
    <div class="box"><h3>Nieuwe aanvraag</h3>
      <div class="row"><label style="flex:1"><input type="radio" name="t" value="taxi" checked> 🚕 Taxi</label><label style="flex:1"><input type="radio" name="t" value="service"> 🛠 Service</label></div>
      <div class="row"><input id="note" placeholder="Opmerking (optioneel)" maxlength="200"></div>
      <div class="row wrap"><button id="loc" style="flex:1">📍 Mijn locatie delen</button></div>
      <div id="locmsg"><small>Tik hierboven: je browser vraagt dan om toestemming.</small></div>
      <div class="row"><button class="pri" id="send" style="flex:1">Aanvragen</button></div>
      <div id="msg"></div></div>
    <div id="reqs"></div>`;
  const draw = () => {
    $('#pts').textContent = points;
    $('#reqs').innerHTML = reqs.map((r) => {
      let st = '', btn = '';
      if (r.status === 'pending') st = '⏳ Wachten op Simon';
      else if (r.status === 'payment_requested') {
        st = `💳 Simon vraagt vooraf betaling: <b>${r.price}</b> punten`;
        btn = points >= r.price ? `<button class="pri" data-pay="${r.id}">Betaal ${r.price} punten</button>` : '<small class="err">Je hebt te weinig punten</small>';
      } else if (r.status === 'paid') st = '✅ Betaald, wachten op Simon';
      else if (r.status === 'accepted') { st = '✅ Request geaccepteerd'; btn = `<button data-dis="${r.id}">Dismiss</button>`; }
      else if (r.status === 'declined') { st = '❌ Request geweigerd'; btn = `<button data-dis="${r.id}">Dismiss</button>`; }
      return `<div class="box"><b>${kind(r.type)}</b>${r.note ? ` · ${esc(r.note)}` : ''} <small>${when(r.created)}</small><br>${st}${btn ? `<div class="row">${btn}</div>` : ''}</div>`;
    }).join('');
    document.querySelectorAll('[data-dis]').forEach((b) => b.onclick = () => updateDoc(doc(db, 'limoRequests', b.dataset.dis), { dismissed: true }).catch((e) => alert(nice(e))));
    document.querySelectorAll('[data-pay]').forEach((b) => b.onclick = async () => {
      const r = reqs.find((x) => x.id === b.dataset.pay); b.disabled = true;
      try {
        const batch = writeBatch(db);
        batch.update(doc(db, 'limoRequests', r.id), { status: 'paid', paidAt: Date.now() });
        batch.update(doc(db, 'users', me.uid), { points: points - r.price, lastPaid: r.id });
        await batch.commit();
      } catch (e) { alert('Betalen is niet gelukt, probeer het opnieuw.'); b.disabled = false; }
    });
  };
  live(doc(db, 'users', me.uid), (d) => { points = d.data()?.points || 0; me.points = points; draw(); });
  live(query(collection(db, 'limoRequests'), where('uid', '==', me.uid)), (sn) => {
    reqs = sn.docs.map((d) => ({ id: d.id, ...d.data() })).filter((r) => !r.dismissed).sort((a, b) => b.created - a.created); draw();
  });
  let loc = null;
  const locError = (e) => {
    const code = e && e.code;
    const how = '<br><small>Safari op iPhone: Instellingen → Privacy en beveiliging → Locatievoorzieningen → Safari-websites → Tijdens gebruik. Op de Mac: Systeeminstellingen → Privacy en beveiliging → Locatievoorzieningen → Safari aan, en Safari → Instellingen → Websites → Locatie → Sta toe.</small>';
    return code === 1 ? `<span class="err">Locatie is geweigerd.</span>${how}` : code === 3 ? '<span class="err">Locatie duurde te lang, probeer het opnieuw.</span>' : `<span class="err">Locatie niet beschikbaar.</span>${how}`;
  };
  const getLoc = () => new Promise((res, rej) => {
    if (!navigator.geolocation) return rej({ code: 2 });
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }), rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
  const askLoc = async () => {
    $('#locmsg').textContent = 'Locatie ophalen… (geef toestemming als je browser erom vraagt)';
    try { loc = await getLoc(); $('#locmsg').innerHTML = `<small>📍 Locatie klaar (±${loc.acc} m)</small>`; return true; }
    catch (e) { loc = null; $('#locmsg').innerHTML = locError(e); return false; }
  };
  $('#loc').onclick = askLoc;
  $('#send').onclick = async () => {
    $('#msg').textContent = '';
    if (!loc && !(await askLoc())) {
      if (!confirm('Je locatie lukt niet. Toch versturen zonder locatie?')) return;
    }
    const type = document.querySelector('input[name=t]:checked').value;
    const note = $('#note').value.trim().slice(0, 200);
    $('#send').disabled = true;
    try {
      await addDoc(collection(db, 'limoRequests'), { uid: me.uid, name: me.name, type, note, lat: loc ? loc.lat : null, lng: loc ? loc.lng : null, acc: loc ? loc.acc : null, status: 'pending', created: Date.now(), dismissed: false });
      $('#note').value = ''; $('#msg').textContent = 'Aanvraag verstuurd ✓';
      const text = `Nieuwe ${type === 'taxi' ? 'taxi' : 'service'}-aanvraag van ${me.name}`;
      addDoc(collection(db, 'notifications'), { to: ADMIN_UID, text, from: me.uid, created: Date.now() }).catch(() => {});
      pushNtfy(text);
    } catch (e) { $('#msg').innerHTML = `<span class="err">Versturen mislukt: ${esc(nice(e))}</span>`; }
    $('#send').disabled = false;
  };
}

/* ---------- Limo Admin ---------- */
async function limoAdminView() {
  const push = (await getDoc(doc(db, 'config', 'push'))).data()?.topic || '';
  $('#view').innerHTML = `
    <div id="areqs"></div>
    <div class="box"><h3>Limo-punten</h3><div id="ausers"></div></div>
    <div class="box"><h3>Melding op je telefoon</h3>
      <p><small>1. Installeer de gratis app <b>ntfy</b> op je iPhone. 2. Tik op + en abonneer op dit onderwerp. De melding bevat alleen een kort bericht (naam en soort), nooit de locatie. Hij gaat via ntfy.sh.</small></p>
      <div class="code" id="topic" style="font-size:.95rem;word-break:break-all;user-select:all">${esc(push) || 'Nog geen onderwerp'}</div>
      <div class="row wrap"><button id="mk">Nieuw onderwerp maken</button><button id="tst">Testmelding</button></div><div id="pm"></div></div>`;
  let areqSig = '', auserSig = '';
  live(collection(db, 'limoRequests'), (sn) => {
    const all = sn.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.created - a.created);
    const sig = JSON.stringify(all.map((r) => [r.id, r.status, r.price, r.dismissed])); if (sig === areqSig) return; areqSig = sig;
    const open = all.filter((r) => ['pending', 'payment_requested', 'paid'].includes(r.status));
    const done = all.filter((r) => ['accepted', 'declined'].includes(r.status)).slice(0, 8);
    const card = (r) => {
      const has = typeof r.lat === 'number' && typeof r.lng === 'number';
      const loc = has ? `📍 <a href="https://maps.apple.com/?ll=${r.lat},${r.lng}&q=${encodeURIComponent(r.name)}" target="_blank" rel="noopener">Apple Kaarten</a> · <a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" rel="noopener">Google Maps</a> <small>(±${r.acc} m)</small>` : '<small>📍 Geen locatie meegestuurd</small>';
      const chip = { pending: 'Nieuw', payment_requested: `Betaling gevraagd: ${r.price}`, paid: 'Betaald ✓', accepted: 'Geaccepteerd', declined: 'Geweigerd' }[r.status];
      const isOpen = ['pending', 'payment_requested', 'paid'].includes(r.status);
      return `<div class="box"><b>${kind(r.type)}</b> · ${esc(r.name)} <span class="chip">${chip}</span><br>${r.note ? `${esc(r.note)}<br>` : ''}${loc}<br><small>${when(r.created)}</small>
        ${isOpen ? `<div class="row wrap"><button class="pri" data-acc="${r.id}">Accepteer</button><button data-dec="${r.id}">Weiger</button></div>
        ${r.status === 'pending' ? `<div class="row"><input type="number" min="1" step="1" placeholder="Punten" id="pr-${r.id}"><button data-pay="${r.id}">Vraag betaling vooraf</button></div>` : ''}`
        : `<div class="row"><button data-del="${r.id}">Verwijder</button></div>`}</div>`;
    };
    $('#areqs').innerHTML = `<div class="box"><h3>Aanvragen</h3>${open.length ? '' : '<small>Geen openstaande aanvragen.</small>'}</div>${open.map(card).join('')}${done.length ? `<small style="display:block;margin:.8rem 0 -.4rem">Afgerond</small>${done.map(card).join('')}` : ''}`;
    const note = (r, text) => addDoc(collection(db, 'notifications'), { to: r.uid, toName: r.name, text, created: Date.now() });
    const find = (id) => all.find((x) => x.id === id);
    const run = (fn) => fn().catch((e) => alert(nice(e)));
    document.querySelectorAll('[data-acc]').forEach((b) => b.onclick = () => run(async () => { const r = find(b.dataset.acc); await updateDoc(doc(db, 'limoRequests', r.id), { status: 'accepted' }); await note(r, `Je ${r.type === 'taxi' ? 'taxi' : 'service'}-aanvraag is geaccepteerd.`); }));
    document.querySelectorAll('[data-dec]').forEach((b) => b.onclick = () => run(async () => { const r = find(b.dataset.dec); await updateDoc(doc(db, 'limoRequests', r.id), { status: 'declined' }); await note(r, 'Je aanvraag is geweigerd.'); }));
    document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => run(() => deleteDoc(doc(db, 'limoRequests', b.dataset.del))));
    document.querySelectorAll('[data-pay]').forEach((b) => b.onclick = () => run(async () => {
      const r = find(b.dataset.pay); const price = parseInt($(`#pr-${r.id}`).value, 10);
      if (!(price > 0)) return alert('Vul een aantal punten in (minimaal 1).');
      await updateDoc(doc(db, 'limoRequests', r.id), { status: 'payment_requested', price });
      await note(r, `Simon vraagt vooraf betaling: ${price} Limo-punten.`);
    }));
  }, (e) => { $('#areqs').innerHTML = `<div class="box err">Aanvragen laden mislukt: ${esc(nice(e))}</div>`; });
  live(collection(db, 'users'), (sn) => {
    const list = sn.docs.map((d) => ({ id: d.id, ...d.data() })).filter((u) => u.status === 'approved' && (u.apps || []).includes('limo')).sort((a, b) => a.name.localeCompare(b.name));
    const sig = JSON.stringify(list.map((u) => [u.id, u.name, u.points || 0])); if (sig === auserSig) return; auserSig = sig;
    $('#ausers').innerHTML = list.length ? list.map((u) => `<div class="row wrap"><span style="flex:1;min-width:6rem"><b>${esc(u.name)}</b> <span class="chip">${u.points || 0} punten</span></span>
      <input type="number" min="1" step="1" value="10" id="am-${u.id}" style="max-width:5rem"><button data-add="${u.id}">＋ Bij</button><button data-sub="${u.id}">− Af</button></div>`).join('')
      : '<small>Nog niemand heeft de Limo-app geïnstalleerd.</small>';
    const change = (id, sign) => {
      const u = list.find((x) => x.id === id); const amt = parseInt($(`#am-${id}`).value, 10);
      if (!(amt > 0)) return alert('Vul een aantal punten in.');
      const next = Math.max(0, (u.points || 0) + sign * amt);
      updateDoc(doc(db, 'users', id), { points: next })
        .then(() => addDoc(collection(db, 'notifications'), { to: id, toName: u.name, text: `Je hebt ${amt} Limo-punten ${sign > 0 ? 'gekregen' : 'verloren'}. Nu: ${next}.`, created: Date.now() }))
        .catch((e) => alert(nice(e)));
    };
    document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => change(b.dataset.add, 1));
    document.querySelectorAll('[data-sub]').forEach((b) => b.onclick = () => change(b.dataset.sub, -1));
  });
  $('#mk').onclick = async () => {
    const t = 'simon-limo-' + [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, '0')).join('');
    await setDoc(doc(db, 'config', 'push'), { topic: t }); $('#topic').textContent = t; $('#pm').textContent = 'Opgeslagen. Abonneer in ntfy op dit nieuwe onderwerp.';
  };
  $('#tst').onclick = async () => { const r = await pushNtfy('Testmelding van Limo Admin'); $('#pm').textContent = r === 'ok' ? 'Testmelding verstuurd. Zie je hem niet op je iPhone? Check of je in ntfy op precies dit onderwerp bent geabonneerd.' : `Mislukt: ${r}`; };
}
